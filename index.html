<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Focus révisions</title>
<meta name="theme-color" content="#14171a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f3f1ec;--surf:#fff;--ink:#1c1b19;--mute:#6b675f;--line:#dcd8cf;--learn:#2f5d50;--learn-bg:#dcebe5;--pray:#a8641a;--pray-bg:#f6e6cf;--rest:#3a6f8f;--rest-bg:#dbe9f2;--end:#6b675f;--end-bg:#e8e5de;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171a;--surf:#1d2125;--ink:#ecebe7;--mute:#9a9a94;--line:#2c3237;--learn:#6fc0a4;--learn-bg:#1d3a31;--pray:#e0a35a;--pray-bg:#3d2d17;--rest:#7fb4d4;--rest-bg:#1b3242;--end:#9a9a94;--end-bg:#262a2e}}
:root[data-theme="dark"]{--bg:#14171a;--surf:#1d2125;--ink:#ecebe7;--mute:#9a9a94;--line:#2c3237;--learn:#6fc0a4;--learn-bg:#1d3a31;--pray:#e0a35a;--pray-bg:#3d2d17;--rest:#7fb4d4;--rest-bg:#1b3242;--end:#9a9a94;--end-bg:#262a2e}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;overflow:hidden}
#app{height:100%;display:grid;grid-template-columns:1fr minmax(240px,34%);gap:12px;padding:12px}
#main{background:var(--surf);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;padding:14px 18px;min-height:0;--c:var(--learn);--cbg:var(--learn-bg)}
#main[data-k="p"]{--c:var(--pray);--cbg:var(--pray-bg)}
#main[data-k="r"]{--c:var(--rest);--cbg:var(--rest-bg)}
#main[data-k="e"]{--c:var(--end);--cbg:var(--end-bg)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{background:var(--cbg);color:var(--c);padding:4px 12px;border-radius:99px;font-size:13px;font-weight:600}
.clock{color:var(--mute);font-size:14px;font-variant-numeric:tabular-nums}
.center{flex:1;display:flex;align-items:center;justify-content:center;gap:28px;min-height:0}
.ringwrap{position:relative;height:min(100%,300px);aspect-ratio:1;max-width:46%}
svg{width:100%;height:100%;transform:rotate(-90deg)}
.bg{fill:none;stroke:var(--line);stroke-width:10}
.fg{fill:none;stroke:var(--c);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .9s linear}
.pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(18px,4vw,30px);font-weight:700;color:var(--c)}
.info{min-width:0;display:flex;flex-direction:column;gap:6px}
#title{font-size:clamp(16px,2.6vw,22px);font-weight:600;line-height:1.25}
#time{display:flex;align-items:center;gap:.14em;font-size:min(clamp(26px,7vw,64px),13vh);font-weight:700;line-height:1;font-variant-numeric:tabular-nums;font-family:"DIN Alternate","Bahnschrift","Roboto Condensed","Segoe UI",system-ui,sans-serif}
.fc{position:relative;width:1.4em;height:1.7em;perspective:9em;color:#dcdcdc}
.fc::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:rgba(0,0,0,.75);z-index:5}
.hh{position:absolute;left:0;right:0;height:50%;overflow:hidden;background:#111;border:1px solid #2a2a2a;backface-visibility:hidden}
.hh.up{top:0;border-bottom:0;border-radius:.24em .24em 0 0;transform-origin:50% 100%}
.hh.dn{bottom:0;border-top:0;border-radius:0 0 .24em .24em;transform-origin:50% 0}
.hh span{position:absolute;left:0;right:0;height:200%;display:flex;align-items:center;justify-content:center}
.hh.up span{top:0}.hh.dn span{bottom:0}
.f1,.f2{visibility:hidden;z-index:3}
.go .f1,.go .f2{visibility:visible}
.go .f1{animation:fl1 .3s ease-in forwards}
.go .f2{animation:fl2 .3s .3s ease-out both}
@keyframes fl1{from{transform:rotateX(0)}to{transform:rotateX(-90deg)}}
@keyframes fl2{from{transform:rotateX(90deg)}to{transform:rotateX(0)}}
.dots{display:flex;flex-direction:column;gap:.3em}
.dots i{display:block;width:.15em;height:.15em;border-radius:50%;background:#777}
#main{position:relative}
#bo{display:none;position:absolute;top:10px;right:10px;z-index:6;opacity:.75}
body.solo #bo{display:block}
body.solo #side,body.solo .top,body.solo .ringwrap,body.solo #title,body.solo #sub,body.solo .day,body.solo .next,body.solo .btns{display:none}
body.solo #app{grid-template-columns:1fr;grid-template-rows:1fr}
body.solo .center{flex-direction:column;justify-content:center;gap:0;padding:0}
body.solo #time{font-size:min(17vw,40vh)}
#lost{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px;color:var(--c);font-weight:600;font-size:14px}
#lost[hidden]{display:none}
#main.pz{--c:#d9534f;--cbg:rgba(217,83,79,.18)}
.lg{max-height:90px;overflow:auto;display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--mute)}
.sub{color:var(--mute);font-size:14px}
.next{border-top:1px solid var(--line);padding-top:8px;font-size:14px;color:var(--mute);display:flex;justify-content:space-between;gap:8px}
.next b{color:var(--ink);font-weight:600}
.day{height:6px;background:var(--line);border-radius:9px;margin:8px 0;overflow:hidden}
.day i{display:block;height:100%;background:var(--c);width:0;transition:width .9s linear}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surf);color:var(--ink);border-radius:12px;padding:9px 14px;cursor:pointer;min-height:40px}
button:focus-visible{outline:3px solid var(--c);outline-offset:2px}
button.on{background:var(--c);border-color:var(--c);color:var(--surf)}
button:disabled{opacity:.4;cursor:default}
#side{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:8px;overflow-y:auto;min-height:0}
.it{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:12px;font-size:14px;border-left:4px solid transparent;margin-bottom:3px}
.it .h{font-variant-numeric:tabular-nums;color:var(--mute);min-width:84px;font-size:13px}
.it[data-k="l"]{border-left-color:var(--learn)}.it[data-k="p"]{border-left-color:var(--pray)}.it[data-k="r"]{border-left-color:var(--rest)}.it[data-k="e"]{border-left-color:var(--end)}
.it.done{opacity:.45;text-decoration:line-through}
.it.cur{background:var(--learn-bg);font-weight:700}
.it.cur[data-k="p"]{background:var(--pray-bg)}.it.cur[data-k="r"]{background:var(--rest-bg)}.it.cur[data-k="e"]{background:var(--end-bg)}
.man .it{cursor:pointer}
#trk{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:calc(10px + env(safe-area-inset-top,0px)) 10px 10px;z-index:5}
#trk[hidden]{display:none}
.tbox{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:14px;max-width:900px;width:100%;max-height:100%;overflow:auto}
.th{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.tg{display:grid;grid-template-columns:repeat(7,minmax(74px,1fr));gap:8px;overflow-x:auto}
.td{border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:4px;align-items:center;font-size:13px}
.td span{color:var(--mute)}
.td.now{border-color:var(--learn);box-shadow:0 0 0 2px var(--learn)}
.cl{width:100%;display:flex;flex-direction:column;gap:3px;margin:4px 0}
.cl i{display:block;height:12px;border-radius:4px;background:linear-gradient(to right,var(--learn) var(--p),var(--line) var(--p))}
.st{display:flex;align-items:center;gap:6px}
.st button{padding:0;min-height:30px;width:30px}
.sum{margin:10px 0 0;color:var(--mute);font-size:14px;line-height:1.5}
.sum b{color:var(--ink)}
.tf{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.nav{display:flex;align-items:center;gap:10px}.nav b{min-width:130px;text-align:center;text-transform:capitalize}
.tw{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;align-items:start}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dh{text-align:center;color:var(--mute);font-size:12px}
.dc{position:relative;height:34px;min-height:0;padding:0 0 6px;border-radius:8px;font-size:13px;font-weight:500}
.dc::after{content:"";position:absolute;left:5px;right:5px;bottom:4px;height:4px;border-radius:3px;background:linear-gradient(to right,var(--learn) var(--p),var(--line) var(--p))}
.dc.now{border-color:var(--learn)}
.dc.sel{background:var(--learn-bg)}
.dp{display:flex;flex-direction:column;gap:8px;font-size:14px}
@media (orientation:portrait){.tw{grid-template-columns:1fr}}
@media (orientation:portrait){
 #app{grid-template-columns:1fr;grid-template-rows:auto 190px}
 .center{flex-direction:column;gap:12px;padding:8px 0}
 .ringwrap{height:200px;max-width:none}
 .info{align-items:center;text-align:center}
 #time{font-size:min(15vw,64px)}
}
@media (orientation:landscape) and (max-height:480px){
 #app{gap:8px;padding:8px}
 #main{padding:10px 14px}
 .sub{font-size:13px}
 button{padding:6px 12px;min-height:34px}
}
@media (prefers-reduced-motion:reduce){.fg,.day i{transition:none}}
</style>
</head>
<body>
<div id="app">
 <section id="main" data-k="l">
  <button id="bo">Tout afficher</button>
  <div class="top"><span class="tag" id="tag">Apprentissage</span><span class="clock" id="clock"></span></div>
  <div class="center">
   <div class="ringwrap">
    <svg viewBox="0 0 200 200" aria-hidden="true"><circle class="bg" cx="100" cy="100" r="90"/><circle class="fg" id="fg" cx="100" cy="100" r="90"/></svg>
    <div class="pct" id="pct">0 %</div>
   </div>
   <div class="info">

   </div>
  </div>
  <div class="day"><i id="dayb"></i></div>
  <div class="next"><span id="next"></span><span id="learned"></span></div>
  <div class="btns" style="margin-top:10px">
   <button id="bm" class="on">Horloge</button>
   <button id="bp" disabled>Démarrer</button>
   <button id="bs" disabled>Bloc suivant</button>
   <button id="bq">Interruption</button>
   <button id="bf">Plein écran</button>
   <button id="bt">Suivi</button>
   <button id="bz">Timer seul</button>
   <button id="bi" hidden>Installer l’app</button>
  </div>
 </section>
 <aside id="side" aria-label="Programme de la journée"></aside>
</div>
<div id="trk" hidden></div>
<script>
var B=[[420,480,'p','Réveil, Fajr, petit-déj'],[480,630,'l','Apprentissage'],[630,645,'r','Pause'],[645,745,'l','Apprentissage'],[745,810,'p','Dhuhr, déjeuner léger, marche'],[810,880,'l','Apprentissage'],[880,900,'p','Asr et pause'],[900,1020,'l','Apprentissage'],[1020,1035,'p','Maghrib'],[1035,1110,'r','Dîner, sport ou pause complète'],[1110,1125,'p','Isha'],[1125,1260,'l','Apprentissage'],[1260,1380,'e','Fin de journée, détente']];

 }else{

 if(i<0){

 }

 var p=el/dur;fg.style.strokeDashoffset=C*(1-p);$('pct').textContent=Math.floor(p*100)+' %';

 var done=0;for(var j=0;j<i;j++)if(B[j][2]==='l')done+=B[j][1]-B[j][0];if(b[2]==='l')done+=el/60;

$('bm').onclick=function(){
 mode=mode==='clock'?'manual':'clock';
 this.textContent=mode==='clock'?'Horloge':'Manuel';
 $('bp').disabled=$('bs').disabled=mode==='clock';
 if(mode==='manual'){var d=new Date(),now=d.getHours()*60+d.getMinutes();M.i=0;for(var k=0;k<B.length;k++)if(now>=B[k][0]&&now<B[k][1])M.i=k;M.el=0;M.run=false;$('bp').textContent='Démarrer'}
 shown=-2;tick();
};
$('bp').onclick=function(){
 if(M.i>=B.length){M.i=0;M.el=0}
 M.run=!M.run;M.last=Date.now();this.textContent=M.run?'Pause':'Démarrer';
 if(M.run){try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(function(l){wl=l}).catch(function(){})}catch(e){}}
 tick();
};
$('bs').onclick=function(){if(M.i<B.length){M.i++;M.el=0;M.last=Date.now();shown=-2;tick()}};
$('bf').onclick=function(){try{var e=document.documentElement;if(document.fullscreenElement)document.exitFullscreen();else if(e.requestFullscreen)e.requestFullscreen()}catch(x){}};
document.addEventListener('visibilitychange',function(){if(!document.hidden){M.last=Date.now();tick()}});
(function(){try{
 function ic(n){var c=document.createElement('canvas');c.width=c.height=n;var x=c.getContext('2d'),s=n/512;
  x.fillStyle='#14171a';x.fillRect(0,0,n,n);

  x.fillStyle='#14171a';x.beginPath();x.arc(256*s,256*s,150*s,0,6.2832);x.fill();
  x.strokeStyle='#dcdcdc';x.lineWidth=22*s;x.lineCap='round';x.beginPath();x.moveTo(256*s,150*s);x.lineTo(256*s,256*s);x.lineTo(320*s,296*s);x.stroke();
  return c.toDataURL('image/png')}
 var i192=ic(192),i512=ic(512);
 var m={name:'Focus révisions',short_name:'Focus',start_url:location.href.split('#')[0],scope:location.origin+'/',display:'standalone',background_color:'#14171a',theme_color:'#14171a',icons:[{src:i192,sizes:'192x192',type:'image/png',purpose:'any'},{src:i512,sizes:'512x512',type:'image/png',purpose:'any'}]};
 var l=document.createElement('link');l.rel='manifest';l.href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(m));document.head.appendChild(l);
 var a=document.createElement('link');a.rel='apple-touch-icon';a.href=i192;document.head.appendChild(a);
}catch(e){}})();
var DP=null;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();DP=e;$('bi').hidden=false});
$('bi').onclick=function(){if(DP){DP.prompt();DP=null;this.hidden=true}};
function solo(on){
 document.body.classList.toggle('solo',on);
 if(on)try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(function(l){wl=l}).catch(function(){})}catch(e){}
}
$('bz').onclick=function(){solo(true)};
$('bo').onclick=function(){solo(false)};
var FC=[],RM=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
(function(){var t=$('time'),h='';
 for(var k=0;k<3;k++){if(k)h+='<div class="dots"><i></i><i></i></div>';
  h+='<div class="fc"><div class="hh up s1"><span></span></div><div class="hh dn s2"><span></span></div><div class="hh up f1"><span></span></div><div class="hh dn f2"><span></span></div></div>'}
 t.innerHTML=h;
 [].forEach.call(t.querySelectorAll('.fc'),function(e){var q=function(c){return e.querySelector('.'+c+' span')};FC.push({el:e,cur:null,t:0,s1:q('s1'),s2:q('s2'),f1:q('f1'),f2:q('f2')})});
})();
function flip(c,v){

 var old=c.cur;c.cur=v;
 if(old===null||RM||document.hidden){c.s1.textContent=c.s2.textContent=v;return}

 c.el.classList.remove('go');void c.el.offsetWidth;c.el.classList.add('go');

}
function setTime(s){var p=s.split(':');for(var k=0;k<3;k++)flip(FC[k],p[k]);$('time').title=s}
var TK={start:null,days:{}},lt=Date.now(),sv=0,rst=false;
try{var rw=localStorage.getItem('fr_track');if(rw)TK=JSON.parse(rw)}catch(e){}
function dk(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function sav(){try{localStorage.setItem('fr_track',JSON.stringify(TK))}catch(e){}}
if(!TK.start){TK.start=dk();sav()}
function dy(k){return TK.days[k]||(TK.days[k]={s:[0,0,0,0,0],c:0})}
function track(i){
 var n=Date.now(),dt=Math.min((n-lt)/1000,60);lt=n;
 if(i<0||B[i][2]!=='l'||PZ||(mode==='manual'&&!M.run))return;
 dy(dk()).s[lnum(i)-1]+=dt;
 if(++sv%10===0)sav();
}
function hm2(m){m=Math.round(m);return Math.floor(m/60)+'h'+String(m%60).padStart(2,'0')}
var LB=B.filter(function(b){return b[2]==='l'}).map(function(b){return b[1]-b[0]});
function renderOld(){
 var o=$('trk'),s=new Date(TK.start+'T12:00:00'),today=dk(),tm=0,nb=0,nc=0,act=0;
 var h='<div class="tbox"><div class="th"><b>Suivi sur 7 jours</b><button id="tx">Fermer</button></div><div class="tg">';
 for(var d=0;d<7;d++){
  var dt=new Date(s.getTime()+d*864e5),k=dk(dt),v=TK.days[k]||{s:[0,0,0,0,0],c:0},m=v.s.reduce(function(a,b){return a+b},0)/60,cells='';
  for(var b=0;b<5;b++){var p=Math.min(100,v.s[b]/60/LB[b]*100);if(p>=90)nb++;cells+='<i style="--p:'+p+'%"></i>'}
  tm+=m;nc+=v.c;if(m>=1)act++;
  h+='<div class="td'+(k===today?' now':'')+'"><b>J'+(d+1)+'</b><span>'+dt.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric'})+'</span><div class="cl">'+cells+'</div><b>'+hm2(m)+'</b><div class="st"><button data-d="'+k+'" data-v="-1" aria-label="Moins un cours">−</button><b>'+v.c+'</b><button data-d="'+k+'" data-v="1" aria-label="Plus un cours">+</button></div><span>cours revus</span></div>';
 }
 h+='</div><p class="sum"><b>'+hm2(tm)+'</b> appris au total, <b>'+nb+'/35</b> blocs terminés, <b>'+nc+'</b> cours revus, <b>'+act+'</b> jour'+(act>1?'s':'')+' actif'+(act>1?'s':'')+'.<br>Les 5 barres de chaque jour sont tes 5 blocs d’apprentissage. Elles se remplissent toutes seules quand le timer tourne sur un bloc d’apprentissage.</p><div class="tf"><button id="tr">'+(rst?'Confirmer : tout effacer':'Recommencer au jour 1')+'</button></div></div>';
 o.innerHTML=h;
}
$('bt').onclick=function(){rst=false;renderT();$('trk').hidden=false};
$('trk').onclick=function(e){
 var t=e.target;
 if(t.id==='tx'||t===this){sav();this.hidden=true;return}
 if(t.dataset&&t.dataset.d){var x=dy(t.dataset.d);x.c=Math.max(0,x.c+Number(t.dataset.v));sav();renderT();return}
 if(t.id==='tr'){if(!rst){rst=true}else{TK={start:dk(),days:{}};sav();rst=false}renderT()}
};
var PZ=TK.pz||null,CI=-1;
function hhmm(ms){return new Date(ms).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}
function lostSecs(k){var v=TK.days[k];if(!v||!v.p)return 0;return v.p.reduce(function(a,q){return a+(q[1]-q[0])/1000},0)}
function lostAll(){var t=0,k;for(k in TK.days)t+=lostSecs(k)/60;return t}
function lostHtml(k){
 var v=TK.days[k],p=v&&v.p?v.p:[];
 if(!p.length)return '<span>Aucune interruption</span>';
 var s='<span>Perdu : <b>'+hm2(lostSecs(k)/60)+'</b> ('+p.length+' interruption'+(p.length>1?'s':'')+')</span><div class="lg">';
 p.forEach(function(q){s+='<span>'+hhmm(q[0])+' → '+hhmm(q[1])+' ('+Math.max(1,Math.round((q[1]-q[0])/60000))+' min)</span>'});
 return s+'</div>';
}
function pzStart(i){
 if(PZ)return;
 var d=new Date(),lim=0;
 if(mode==='clock')lim=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime()+B[i][1]*60000;
 PZ={start:Date.now(),lim:lim,wr:mode==='manual'&&M.run};
 if(mode==='manual'){M.run=false;$('bp').textContent='Démarrer'}
 TK.pz=PZ;sav();
}
function pzEnd(at){
 if(!PZ)return;
 var end=at||Date.now(),x=dy(dk(new Date(PZ.start)));
 x.p=x.p||[];
 if(end-PZ.start>=5000)x.p.push([PZ.start,end]);
 if(PZ.wr){M.run=true;M.last=Date.now();$('bp').textContent='Pause'}
 PZ=null;delete TK.pz;sav();
}
function pzTick(i){
 if(PZ&&PZ.lim&&Date.now()>=PZ.lim)pzEnd(PZ.lim);
 var on=!!PZ;
 $('main').classList.toggle('pz',on);
 $('lost').hidden=!on;
 if(on)$('lt').textContent='Interrompu depuis '+hhmm(PZ.start)+' · perdu '+fmt((Date.now()-PZ.start)/1000);
 $('bq').textContent=on?'Reprendre':'Interruption';
 $('bq').disabled=!(on||(i>=0&&B[i][2]==='l'&&(mode==='clock'||M.run)));
 $('bm').disabled=on;
 var dd=mode==='clock'||on;$('bp').disabled=dd;$('bs').disabled=dd;
}
$('bq').onclick=function(){if(PZ)pzEnd();else if(CI>=0&&B[CI][2]==='l')pzStart(CI);tick()};
$('br').onclick=function(){pzEnd();tick()};
var VM=null,SEL=null,MN=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
function dmin(k){var v=TK.days[k];return v?v.s.reduce(function(a,b){return a+b},0)/60:0}
function renderT(){
 var o=$('trk'),ob=o.querySelector('.tbox'),sc=ob?ob.scrollTop:0,td=new Date(),today=dk(td),lo=2026*12+8,hi=2027*12+5;
 if(VM===null)VM=td.getFullYear()*12+td.getMonth();
 VM=Math.max(lo,Math.min(hi,VM));if(!SEL)SEL=today;
 var y=Math.floor(VM/12),m=VM%12,off=(new Date(y,m,1).getDay()+6)%7,nd=new Date(y,m+1,0).getDate(),i,b;
 var h='<div class="tbox"><div class="th"><span class="nav"><button id="pm"'+(VM<=lo?' disabled':'')+' aria-label="Mois précédent">‹</button><b>'+MN[m]+' '+y+'</b><button id="nm"'+(VM>=hi?' disabled':'')+' aria-label="Mois suivant">›</button></span><button id="tx">Fermer</button></div><div class="tw"><div class="cal">';
 'LMMJVSD'.split('').forEach(function(c){h+='<span class="dh">'+c+'</span>'});
 for(i=0;i<off;i++)h+='<span></span>';
 for(var d=1;d<=nd;d++){var k=dk(new Date(y,m,d));h+='<button class="dc'+(k===today?' now':'')+(k===SEL?' sel':'')+'" data-k="'+k+'" style="--p:'+Math.min(100,dmin(k)/totalL*100)+'%">'+d+'</button>'}
 var sv2=TK.days[SEL]||{s:[0,0,0,0,0],c:0},sd=new Date(SEL+'T12:00:00'),bars='';
 for(b=0;b<5;b++)bars+='<i style="--p:'+Math.min(100,sv2.s[b]/60/LB[b]*100)+'%"></i>';
 h+='</div><div class="dp"><b>'+sd.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})+'</b><span>Appris : <b>'+hm2(dmin(SEL))+'</b> sur '+hm2(totalL)+'</span>'+lostHtml(SEL)+'<div class="cl">'+bars+'</div><div class="st"><button data-v="-1" aria-label="Moins un cours">−</button><b>'+sv2.c+'</b><button data-v="1" aria-label="Plus un cours">+</button><span>cours revus</span></div></div></div>';
 var tm=0,act=0,nb=0,nc=0,key,vv,mm,st=0,c=new Date();
 for(key in TK.days){vv=TK.days[key];mm=dmin(key);tm+=mm;nc+=vv.c;if(mm>=60)act++;for(b=0;b<5;b++)if(vv.s[b]/60>=LB[b]*.9)nb++}
 if(dmin(dk(c))<60)c.setDate(c.getDate()-1);
 while(dmin(dk(c))>=60&&st<400){st++;c.setDate(c.getDate()-1)}
 var left=Math.max(0,Math.ceil((new Date(2027,5,30,23,59)-td)/864e5));
 h+='<p class="sum"><b>'+hm2(tm)+'</b> appris depuis septembre, <b>'+act+'</b> jours à 1 h ou plus, série en cours : <b>'+st+'</b> jour'+(st>1?'s':'')+', <b>'+nb+'</b> blocs terminés, <b>'+nc+'</b> cours revus, <b>'+hm2(lostAll())+'</b> perdus en interruptions.<br><b>'+left+'</b> jours avant le 30 juin. Dans le jour sélectionné, les 5 barres sont tes blocs d’apprentissage ; le petit trait sous chaque date montre le temps appris ce jour-là.</p><div class="tf"><button id="tr">'+(rst?'Confirmer : tout effacer':'Tout effacer')+'</button></div></div>';
 o.innerHTML=h;
 var nb2=o.querySelector('.tbox');if(nb2)nb2.scrollTop=sc;
}
$('bt').onclick=function(){VM=null;SEL=null;rst=false;renderT();$('trk').hidden=false};
$('trk').onclick=function(e){
 var t=e.target;
 if(t.id==='tx'||t===this){sav();this.hidden=true;return}
 if(t.id==='pm'){VM--;renderT();return}
 if(t.id==='nm'){VM++;renderT();return}
 if(t.dataset&&t.dataset.k){SEL=t.dataset.k;renderT();return}
 if(t.dataset&&t.dataset.v){var x=dy(SEL);x.c=Math.max(0,x.c+Number(t.dataset.v));sav();renderT();return}
 if(t.id==='tr'){if(!rst){rst=true}else{TK={start:dk(),days:{}};sav();rst=false}renderT()}
};
setInterval(function(){if(!$('trk').hidden)renderT()},5000);
document.addEventListener('visibilitychange',function(){if(document.hidden)sav()});
tick();setInterval(tick,1000);
</script>
</body>
</html>
