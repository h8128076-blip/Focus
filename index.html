<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Focus révisions</title>
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#000;--surf:#0a0a0a;--ink:#ecebe7;--mute:#9a9a94;--line:#1f1f1f;--learn:#6fc0a4;--learn-bg:#0f2620;--pray:#e0a35a;--pray-bg:#2a1f0e;--rest:#7fb4d4;--rest-bg:#0e2230;--end:#9a9a94;--end-bg:#161616;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;overflow:hidden}
#app{height:100%;display:grid;grid-template-columns:1fr minmax(240px,34%);gap:12px;padding:12px}
#main{background:var(--surf);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;padding:14px 18px;min-height:0;--c:var(--learn);--cbg:var(--learn-bg)}
#main[data-k="p"]{--c:var(--pray);--cbg:var(--pray-bg)}
#main[data-k="r"]{--c:var(--rest);--cbg:var(--rest-bg)}
#main[data-k="e"]{--c:var(--end);--cbg:var(--end-bg)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{background:var(--cbg);color:var(--c);padding:4px 12px;border-radius:99px;font-size:13px;font-weight:600}
.clock{color:var(--mute);font-size:14px;font-variant-numeric:tabular-nums}
.center{flex:1;display:flex;align-items:center;justify-content:center;gap:28px;min-height:0}
.ringwrap{position:relative;height:min(100%,300px);aspect-ratio:1;max-width:46%}
svg{width:100%;height:100%;transform:rotate(-90deg)}
.bg{fill:none;stroke:var(--line);stroke-width:10}
.fg{fill:none;stroke:var(--c);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .9s linear}
.pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(18px,4vw,30px);font-weight:700;color:var(--c)}
.info{min-width:0;display:flex;flex-direction:column;gap:6px}
#title{font-size:clamp(16px,2.6vw,22px);font-weight:600;line-height:1.25}
#time{display:flex;align-items:center;gap:.14em;font-size:min(clamp(26px,7vw,64px),13vh);font-weight:700;line-height:1;font-variant-numeric:tabular-nums;font-family:"DIN Alternate","Bahnschrift","Roboto Condensed","Segoe UI",system-ui,sans-serif}
.fc{position:relative;width:1.4em;height:1.7em;perspective:9em;color:#dcdcdc}
.fc::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:rgba(0,0,0,.75);z-index:5}
.hh{position:absolute;left:0;right:0;height:50%;overflow:hidden;background:#111;border:1px solid #2a2a2a;backface-visibility:hidden}
.hh.up{top:0;border-bottom:0;border-radius:.24em .24em 0 0;transform-origin:50% 100%}
.hh.dn{bottom:0;border-top:0;border-radius:0 0 .24em .24em;transform-origin:50% 0}
.hh span{position:absolute;left:0;right:0;height:200%;display:flex;align-items:center;justify-content:center}
.hh.up span{top:0}.hh.dn span{bottom:0}
.f1,.f2{visibility:hidden;z-index:3}
.go .f1,.go .f2{visibility:visible}
.go .f1{animation:fl1 .3s ease-in forwards}
.go .f2{animation:fl2 .3s .3s ease-out both}
@keyframes fl1{from{transform:rotateX(0)}to{transform:rotateX(-90deg)}}
@keyframes fl2{from{transform:rotateX(90deg)}to{transform:rotateX(0)}}
.dots{display:flex;flex-direction:column;gap:.3em}
.dots i{display:block;width:.15em;height:.15em;border-radius:50%;background:#777}
#main{position:relative}
#bo{display:none;position:absolute;top:10px;right:10px;z-index:6;width:44px;height:44px;min-width:44px;padding:0;background:none;border:0;box-shadow:none;color:var(--learn);font-size:34px;line-height:1;font-weight:400;opacity:.85}
body.solo #bo{display:block}
body.solo #side,body.solo .top,body.solo .ringwrap,body.solo #title,body.solo #sub,body.solo .day,body.solo .next,body.solo .btns{display:none}
body.solo #app{grid-template-columns:1fr;grid-template-rows:1fr}
body.solo .center{flex-direction:column;justify-content:center;gap:0;padding:0}
body.solo #time{font-size:min(17vw,40vh)}
#lost{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px;color:var(--c);font-weight:600;font-size:14px}
#lost[hidden]{display:none}
#main.pz{--c:#d9534f;--cbg:rgba(217,83,79,.18)}
.lg{max-height:90px;overflow:auto;display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--mute)}
.sub{color:var(--mute);font-size:14px}
.next{border-top:1px solid var(--line);padding-top:8px;font-size:14px;color:var(--mute);display:flex;justify-content:space-between;gap:8px}
.next b{color:var(--ink);font-weight:600}
.day{height:6px;background:var(--line);border-radius:9px;margin:8px 0;overflow:hidden}
.day i{display:block;height:100%;background:var(--c);width:0;transition:width .9s linear}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surf);color:var(--ink);border-radius:12px;padding:9px 14px;cursor:pointer;min-height:40px}
button:focus-visible{outline:3px solid var(--c);outline-offset:2px}
button.on{background:var(--c);border-color:var(--c);color:var(--surf)}
button:disabled{opacity:.4;cursor:default}
#side{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:8px;overflow-y:auto;min-height:0}
.it{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:12px;font-size:14px;border-left:4px solid transparent;margin-bottom:3px}
.it .h{font-variant-numeric:tabular-nums;color:var(--mute);min-width:84px;font-size:13px}
.it[data-k="l"]{border-left-color:var(--learn)}.it[data-k="p"]{border-left-color:var(--pray)}.it[data-k="r"]{border-left-color:var(--rest)}.it[data-k="e"]{border-left-color:var(--end)}
.it.done{opacity:.45;text-decoration:line-through}
.it.cur{background:var(--learn-bg);font-weight:700}
.it.cur[data-k="p"]{background:var(--pray-bg)}.it.cur[data-k="r"]{background:var(--rest-bg)}.it.cur[data-k="e"]{background:var(--end-bg)}
.stt{display:flex;flex-direction:column;gap:6px;margin-top:12px}.stt .st span{color:var(--mute);font-size:13px}
.bars{display:flex;gap:6px;align-items:flex-end;height:70px}.bc{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;font-size:11px;color:var(--mute)}
.bc i{display:block;width:100%;min-height:2px;background:var(--mute);opacity:.5;border-radius:4px 4px 0 0}.bc i.ok{background:var(--learn);opacity:1}
.cr{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}.cr span{flex:1;min-width:0}.cr button{min-height:32px;padding:2px 10px}
#cn{flex:1;min-width:0;background:var(--surf);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px;font:inherit}
#tg{min-width:0;flex:1;max-width:55%;background:var(--surf);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:5px 8px;font:inherit;font-size:13px}
.nv{display:flex;align-items:center;justify-content:space-between;text-align:center;margin:4px 0 14px}.nv button{font-size:22px;width:44px;padding:0}
.big{font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}.big small{font-size:.5em;font-weight:600;color:var(--mute);margin:0 .25em 0 .05em}
.dl{color:var(--mute);margin-top:6px;font-size:14px;text-transform:capitalize}
.plot{position:relative;height:150px;margin:8px 0 4px 34px}
.gl{position:absolute;left:0;right:0;border-top:1px solid var(--line)}.gl span{position:absolute;left:-34px;top:-8px;font-size:11px;color:var(--mute)}
.goal{position:absolute;left:0;right:0;border-top:1px dashed var(--learn);opacity:.8}
.cols{position:absolute;inset:0;display:flex;gap:8px;padding:0 6px}
.col{flex:1;height:100%;min-height:0;padding:0;border:0;background:none;display:flex;align-items:flex-end;justify-content:center}
.col i{width:100%;display:block;min-height:3px;background:var(--mute);opacity:.4;border-radius:5px 5px 0 0}.col.on i{background:var(--ink);opacity:1}
.lbs{display:flex;gap:8px;padding:0 6px;margin-left:34px;font-size:12px;color:var(--mute);text-align:center}.lbs span{flex:1}.lbs .on{color:var(--ink);font-weight:700}
.card{background:var(--bg);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:14px;margin-bottom:12px}
.rw{display:flex;justify-content:space-between;gap:8px;margin-top:6px}.pb{height:6px;border-radius:4px;background:var(--line);overflow:hidden}.pb i{display:block;height:100%;border-radius:4px}
.gs span{color:var(--mute);font-size:13px}
#main[data-k="r"] .fc{color:#9fd0ee}
html{color-scheme:dark}
body{touch-action:manipulation;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
input,select{-webkit-user-select:text;user-select:text}
button{min-height:44px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btns button{flex:1 1 30%;min-width:0;min-height:48px;padding:6px 8px;order:2;display:inline-flex;align-items:center;justify-content:center;text-align:center}
#bq{order:1}
#bi[hidden]{display:none!important}
.top{flex-wrap:wrap}
#tg{order:3;flex:1 1 100%;max-width:none;min-height:40px;font-size:15px}
#cn{font-size:16px;min-height:44px}
.st button,.cr button{min-height:40px;min-width:40px}
.th{position:sticky;top:0;background:var(--surf);z-index:2;padding:4px 0 8px}
#bo{min-height:44px;min-width:44px}
@media (orientation:portrait){
 body{overflow-y:auto}
 #app{height:auto;min-height:100%;grid-template-rows:auto auto}
 #main{min-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
 .center{flex:1}
 .btns{margin-top:auto;padding-top:10px}
 #side{max-height:none}
 #time{font-size:min(16vw,70px)}
}
@media (orientation:landscape){.btns button{flex:1 1 18%}#tg{order:0;flex:1 1 auto;max-width:55%}}
@media (max-width:700px),(max-height:500px){.tbox{border-radius:0;max-width:none;height:100%}}
.gh{margin-top:14px;font-weight:700;font-size:13px;color:var(--learn);text-transform:uppercase;letter-spacing:.04em}
.tbox{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:14px;max-width:900px;width:100%;max-height:100%;overflow:auto}
.th{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.tg{display:grid;grid-template-columns:repeat(7,minmax(74px,1fr));gap:8px;overflow-x:auto}
.td{border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:4px;align-items:center;font-size:13px}
.td span{color:var(--mute)}
.td.now{border-color:var(--learn);box-shadow:0 0 0 2px var(--learn)}
.cl{width:100%;display:flex;flex-direction:column;gap:3px;margin:4px 0}
.cl i{display:block;height:12px;border-radius:4px;background:linear-gradient(to right,var(--learn) var(--p),var(--line) var(--p))}
.st{display:flex;align-items:center;gap:6px}
.st button{padding:0;min-height:30px;width:30px}
.sum{margin:10px 0 0;color:var(--mute);font-size:14px;line-height:1.5}
.sum b{color:var(--ink)}
.tf{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.nav{display:flex;align-items:center;gap:10px}.nav b{min-width:130px;text-align:center;text-transform:capitalize}
.tw{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;align-items:start}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dh{text-align:center;color:var(--mute);font-size:12px}
.dc{position:relative;height:34px;min-height:0;padding:0 0 6px;border-radius:8px;font-size:13px;font-weight:500}
.dc::after{content:"";position:absolute;left:5px;right:5px;bottom:4px;height:4px;border-radius:3px;background:linear-gradient(to right,var(--learn) var(--p),var(--line) var(--p))}
.dc.now{border-color:var(--learn)}
.dc.sel{background:var(--learn-bg)}
.dp{display:flex;flex-direction:column;gap:8px;font-size:14px}
@media (orientation:portrait){.tw{grid-template-columns:1fr}}
@media (orientation:portrait){
 #app{grid-template-columns:1fr;grid-template-rows:auto 190px}
 .center{flex-direction:column;gap:12px;padding:8px 0}
 .ringwrap{height:200px;max-width:none}
 .info{align-items:center;text-align:center}
 #time{font-size:min(15vw,64px)}
}
@media (orientation:landscape) and (max-height:480px){
 #app{gap:8px;padding:8px}
 #main{padding:10px 14px}
 .sub{font-size:13px}
 button{padding:6px 12px;min-height:34px}
}
@media (prefers-reduced-motion:reduce){.fg,.day i{transition:none}}

#pager{height:100%;width:100%;overflow:hidden;position:relative}
#track{display:flex;width:300%;height:100%;transform:translateX(-33.3333%);transition:transform .3s ease}
body.tsk #track{transform:translateX(0)}
body.pom #track{transform:translateX(-66.6667%)}
.pane{width:33.3333%;height:100%;overflow-y:auto;overflow-x:hidden}
#p2{padding:12px}
#dots{position:fixed;left:0;right:0;bottom:calc(2px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:4;pointer-events:none}
#dots button{pointer-events:auto;width:30px;height:22px;min-height:0;padding:0;background:none;border:0;border-radius:0}
#dots button::after{content:"";display:block;margin:auto;width:8px;height:8px;border-radius:50%;background:var(--line)}
#dots button.cur::after{background:var(--mute)}
body.solo #dots{display:none}
#p2{padding:12px;font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-feature-settings:"tnum" 1,"cv11" 1;-webkit-font-smoothing:antialiased;line-height:1.35}
#pomo{background:var(--surf);border:1px solid var(--line);border-radius:22px;display:flex;flex-direction:column;padding:16px 18px;min-height:100%;--c:var(--learn);--cbg:var(--learn-bg)}
#pomo[data-k="b"]{--c:var(--rest);--cbg:var(--rest-bg)}
#pomo[data-k="L"]{--c:var(--pray);--cbg:var(--pray-bg)}
#pomo .tag{font-weight:600;letter-spacing:.01em}
#pchoose,#prun{flex:1;display:flex;flex-direction:column;min-height:0}
#pchoose[hidden],#prun[hidden]{display:none}
#pchoose{justify-content:center;gap:12px;padding:14px 0 10px}
.ph{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.ph2{color:var(--mute);font-size:15px;margin:-4px 0 6px}
.pt{display:flex;align-items:center;gap:16px;text-align:left;width:100%;padding:14px 16px;border-radius:20px;background:var(--bg);border:1px solid var(--line);min-height:92px;transition:transform .12s,border-color .12s}
.pt:active{transform:scale(.98);border-color:var(--c)}
.pn{flex:0 0 76px;height:68px;border-radius:16px;background:var(--cbg);color:var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center}
.pn b{font-size:30px;font-weight:800;line-height:1;letter-spacing:-.03em}
.pn small{font-size:12px;font-weight:600;margin-top:3px;opacity:.9}
.pd{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.pd strong{font-size:18px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.pd em{font-style:normal;font-size:14px;font-weight:400;color:var(--mute)}
.pg{font-size:26px;color:var(--mute);font-weight:400}
#prun{align-items:center;justify-content:center;gap:18px;padding:8px 0 4px}
.pring{position:relative;width:min(78vw,340px,44vh);aspect-ratio:1;flex:0 0 auto}
.pin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
#pphase{font-size:15px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--c)}
#ptime{font-size:calc(min(78vw,340px,44vh)*.25);font-weight:800;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
#psub{font-size:14px;color:var(--mute)}
.pside{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:14px}
#pcyc{display:flex;gap:10px}
#pcyc i{width:14px;height:14px;border-radius:50%;background:var(--line)}
#pcyc i.f{background:var(--c)}
#pcyc i.c{box-shadow:0 0 0 3px var(--cbg),0 0 0 5px var(--c)}
#pnext{font-size:15px;color:var(--mute);text-align:center}
#pnext b{color:var(--ink);font-weight:600}
.pbtns{display:flex;gap:10px;width:100%;margin-top:4px}
.pbtns button{min-height:58px;border-radius:18px;font-size:17px;font-weight:700}
#pp{flex:2;background:var(--c);border-color:var(--c);color:#04110c}
#pp.paused{background:transparent;color:var(--c)}
#px{flex:1}
#px.sure{border-color:#d9534f;color:#ff8a86}
@media (orientation:landscape) and (max-height:520px){
 #pchoose{flex-direction:row;flex-wrap:wrap;align-content:center}
 .ph,.ph2{flex:1 1 100%}
 .pt{flex:1 1 30%;min-height:84px;flex-direction:column;align-items:flex-start;gap:8px}
 .pg{display:none}
 #prun{flex-direction:row;gap:28px}
 .pring{width:min(66vh,300px)}
 #ptime{font-size:calc(min(66vh,300px)*.25)}
}

/* --- finitions du timer principal --- */
#main{border-radius:24px;background:radial-gradient(120% 65% at 50% 0%,color-mix(in srgb,var(--c) 10%,var(--surf)),var(--surf) 64%);border-color:color-mix(in srgb,var(--c) 24%,var(--line));box-shadow:0 12px 34px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.04);transition:border-color .6s}
#main .tag{display:inline-flex;align-items:center;font-weight:700;letter-spacing:.02em;padding:6px 14px 6px 12px}
#main .tag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c);margin-right:8px;box-shadow:0 0 8px var(--c)}
.clock{font-weight:500;letter-spacing:.02em}
.bg{stroke-width:9;opacity:.85}
.fg{stroke-width:9;filter:drop-shadow(0 0 5px color-mix(in srgb,var(--c) 55%,transparent))}
.pct{font-weight:700;letter-spacing:-.01em}
#title{font-weight:700;letter-spacing:-.015em}
#sub{font-variant-numeric:tabular-nums;letter-spacing:.01em}
.fc{border-radius:.24em;box-shadow:0 .1em .22em rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.03);text-shadow:0 .03em .05em rgba(0,0,0,.55)}
.hh.up{background:linear-gradient(180deg,#232323 0,#161616 100%)}
.hh.dn{background:linear-gradient(180deg,#0e0e0e 0,#1a1a1a 100%)}
.fc::before{content:"";position:absolute;left:-1px;right:-1px;top:50%;height:.14em;margin-top:-.07em;z-index:6;pointer-events:none;background:linear-gradient(90deg,#000 0,#000 .04em,transparent .04em,transparent calc(100% - .04em),#000 calc(100% - .04em))}
.fc::after{height:2px;margin-top:-1px;background:rgba(0,0,0,.8)}
.dots i{background:var(--mute);opacity:.8}
.day{height:8px;border-radius:99px;background:color-mix(in srgb,var(--line) 85%,transparent)}
.day i{border-radius:99px;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 65%,#000),var(--c));box-shadow:0 0 10px color-mix(in srgb,var(--c) 45%,transparent)}
.next{border-top-color:color-mix(in srgb,var(--line) 80%,transparent)}
.btns button{border-radius:14px;transition:transform .12s,background .2s,border-color .2s}
.btns button:active{transform:scale(.97)}
#side{border-radius:24px;box-shadow:0 12px 34px rgba(0,0,0,.4)}
.it{border-radius:14px;padding:10px 12px;transition:background .3s}
.it.cur{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--learn) 35%,transparent)}
.it .h{letter-spacing:.01em}

/* --- synchronisation prières --- */
.sy-h{position:sticky;top:0;z-index:3;background:var(--surf);padding:2px 4px 6px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sy-s{font-size:12px;color:var(--mute)}
.sy-b{flex:0 0 auto;width:36px;height:36px;min-width:0;min-height:0;padding:0;border:0;border-radius:10px;background:none;color:var(--mute);display:flex;align-items:center;justify-content:center}
.sy-b:active{background:var(--line);color:var(--ink)}
.sy-b svg{width:19px;height:19px;transform:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@keyframes sysp{to{transform:rotate(360deg)}}
#side.ld .sy-b svg{animation:sysp .9s linear infinite}
@media (orientation:portrait){#app{grid-template-rows:auto 220px}}

/* --- planning / tâches --- */
#p3{padding:12px 12px 38px;font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.35}
#tasks{background:var(--surf);border:1px solid var(--line);border-radius:22px;display:flex;flex-direction:column;gap:12px;padding:16px 18px;min-height:100%;--c:var(--learn);--cbg:var(--learn-bg)}
#tadd{display:flex;gap:8px}
#tin{flex:1;min-width:0;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:0 14px;font:inherit;font-size:16px;min-height:48px}
#tin:focus-visible{outline:2px solid var(--c);outline-offset:1px}
#tbtn{min-height:48px;padding:0 16px;border-radius:14px;background:var(--c);border-color:var(--c);color:#04110c}
#tbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
#tbar button{min-height:36px;padding:4px 12px;font-size:13px;border-radius:99px;background:none;color:var(--mute)}
#tlist{display:flex;flex-direction:column;gap:8px}
.te{color:var(--mute);text-align:center;padding:28px 8px;font-size:15px}
.tk{background:var(--bg);border:1px solid var(--line);border-left:4px solid var(--mute);border-radius:16px;padding:8px 10px;display:flex;flex-direction:column;gap:8px;transition:border-color .2s,opacity .2s}
.tk[data-p="0"]{border-left-color:#d9534f}.tk[data-p="1"]{border-left-color:var(--pray)}.tk[data-p="2"]{border-left-color:var(--rest)}
.tk.sel{border-color:var(--c);border-left-width:4px}
.tk[data-p="0"].sel{border-left-color:#d9534f}.tk[data-p="1"].sel{border-left-color:var(--pray)}.tk[data-p="2"].sel{border-left-color:var(--rest)}
.tr{display:flex;align-items:center;gap:10px}
.tc{flex:0 0 auto;width:32px;height:32px;min-width:0;min-height:0;padding:0;border-radius:50%;border:2px solid var(--mute);background:none;color:#04110c;font-size:17px;font-weight:800;display:flex;align-items:center;justify-content:center}
.tk.done .tc{background:var(--learn);border-color:var(--learn)}
.tm{flex:1;min-width:0;padding:6px 0;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.tx{font-size:16px;font-weight:600;word-break:break-word}
.tk.done .tx{text-decoration:line-through;color:var(--mute)}
.tk.done{opacity:.65}
.tpb{font-size:12px;font-weight:600;color:var(--mute)}
.tk[data-p="0"] .tpb{color:#ff8a86}.tk[data-p="1"] .tpb{color:var(--pray)}.tk[data-p="2"] .tpb{color:var(--rest)}
.ta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-top:8px;border-top:1px solid var(--line)}
.ta button{min-height:38px;min-width:38px;padding:4px 10px;font-size:13px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center}
.ta svg{width:18px;height:18px;transform:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ta .pp.on{background:var(--c);border-color:var(--c);color:#04110c}
.ta .pp[data-p="0"].on{background:#d9534f;border-color:#d9534f;color:#fff}
.ta .pp[data-p="1"].on{background:var(--pray);border-color:var(--pray)}
.ta .pp[data-p="2"].on{background:var(--rest);border-color:var(--rest)}
.ta .sp{flex:1}
.ta .tdel{color:#ff8a86;border-color:#4a2220}

 N[7][0]=N[6][1];N[7][1]=N[8][0];

 N[11][0]=N[10][1];
 if(1260-N[11][0]>=15){N[11][1]=1260;N[12][0]=1260;N[12][1]=1380}
 else{N[12][0]=N[10][1];N[12][1]=Math.min(1440,N[12][0]+120);N.splice(11,1)}
 for(i=0;i<N.length;i++){if(N[i][1]<=N[i][0]||N[i][1]>1440)return false;if(i&&N[i][0]!==N[i-1][1])return false}
 B.length=0;N.forEach(function(b){B.push(b)});return true;
}
function syReset(){
 B.length=0;B0.forEach(function(b){B.push(b.slice())});
 SY.day=null;SY.t=null;SY.msg=null;sySave();shown=-2;prev=curIdx();
}
if(SY.day===dk()&&SY.t&&!applyPrayers(SY.t)){SY.day=null;SY.t=null}
function syncPray(){
 if(SY.busy)return;
 SY.busy=true;$('side').classList.add('ld');setMsg('Synchronisation…');
 var c=POS,d=new Date(),
  ds=String(d.getDate()).padStart(2,'0')+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+d.getFullYear(),
  url='https://api.aladhan.com/v1/timings/'+ds+'?latitude='+c.lat+'&longitude='+c.lon+'&method=12&timezonestring=Europe%2FParis',
  ctl=window.AbortController?new AbortController():null,
  to=setTimeout(function(){if(ctl)ctl.abort()},9000);
 fetch(url,{cache:'no-store',signal:ctl?ctl.signal:undefined})
 .then(function(r){if(!r.ok)throw new Error('http');return r.json()})
 .then(function(j){
  var T=j.data.timings,t={};
  ['Fajr','Dhuhr','Asr','Maghrib','Isha'].forEach(function(k){t[k]=toMin(T[k]);if(t[k]===null)throw new Error('fmt')});
  if(!applyPrayers(t))throw new Error('inconsistent');
  SY.day=dk();SY.t=t;SY.at=Date.now();SY.msg=null;sySave();
  shown=-2;prev=curIdx();
 })
 .catch(function(){setMsg('Échec : vérifie ta connexion')})
 .then(function(){clearTimeout(to);SY.busy=false;$('side').classList.remove('ld');shown=-2;tick()});
}


/* ===== Planning / tâches ===== */
var TS=[],TSEL=null,PL=['Haute','Moyenne','Basse'];
try{TS=JSON.parse(localStorage.getItem('fr_tasks')||'[]');if(!Array.isArray(TS))TS=[]}catch(e){TS=[]}
function tSave(){try{localStorage.setItem('fr_tasks',JSON.stringify(TS))}catch(e){}}
function tIdx(id){for(var i=0;i<TS.length;i++)if(TS[i].id===id)return i;return -1}
var IC={up:'<svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="6 15 12 9 18 15"/></svg>',dn:'<svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>',tr:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></svg>'};
function tBtn(cls,html,label,fn,dis){var b=document.createElement('button');b.className=cls;b.innerHTML=html;if(label)b.setAttribute('aria-label',label);b.disabled=!!dis;b.onclick=function(e){e.stopPropagation();fn()};return b}
function tMove(id,d){var i=tIdx(id),j=i+d;if(i<0||j<0||j>=TS.length)return;var t=TS[i];TS[i]=TS[j];TS[j]=t;tSave();tRender(id)}
function tRender(focusId){
 var L=$('tlist');L.innerHTML='';
 if(!TS.length){var e=document.createElement('div');e.className='te';e.textContent='Aucune tâche pour le moment.';L.appendChild(e)}
 TS.forEach(function(t,i){
  var r=document.createElement('div');r.className='tk'+(t.d?' done':'')+(t.id===TSEL?' sel':'');r.dataset.p=t.p;
  var row=document.createElement('div');row.className='tr';
  var c=tBtn('tc',t.d?'✓':'',t.d?'Décocher':'Cocher',function(){t.d=!t.d;tSave();tRender()});
  var m=document.createElement('div');m.className='tm';
  var x=document.createElement('div');x.className='tx';x.textContent=t.t;
  var pb=document.createElement('div');pb.className='tpb';pb.textContent='Priorité '+PL[t.p].toLowerCase();
  m.appendChild(x);m.appendChild(pb);
  m.onclick=function(){TSEL=TSEL===t.id?null:t.id;tRender(TSEL)};
  row.appendChild(c);row.appendChild(m);r.appendChild(row);
  if(t.id===TSEL){
   var a=document.createElement('div');a.className='ta';
   a.appendChild(tBtn('',IC.up,'Monter',function(){tMove(t.id,-1)},i===0));
   a.appendChild(tBtn('',IC.dn,'Descendre',function(){tMove(t.id,1)},i===TS.length-1));
   PL.forEach(function(n,k){var b=tBtn('pp'+(t.p===k?' on':''),n,'Priorité '+n.toLowerCase(),function(){t.p=k;tSave();tRender(t.id)});b.dataset.p=k;a.appendChild(b)});
   var sp=document.createElement('span');sp.className='sp';a.appendChild(sp);
   a.appendChild(tBtn('tdel',IC.tr,'Supprimer',function(){TS.splice(tIdx(t.id),1);if(TSEL===t.id)TSEL=null;tSave();tRender()}));
   r.appendChild(a);
  }
  r.dataset.id=t.id;L.appendChild(r);
 });
 var n=TS.filter(function(t){return t.d}).length;
 $('tcount').textContent=TS.length?n+'/'+TS.length+' faites':'';
 $('tclr').disabled=!n;$('tsort').disabled=TS.length<2;
 if(focusId){var el=L.querySelector('[data-id="'+focusId+'"]');if(el&&el.scrollIntoView)el.scrollIntoView({block:'nearest'})}
}
function tAdd(){
 var v=$('tin').value.trim();if(!v)return;
 TS.push({id:Date.now()+'-'+Math.floor(Math.random()*1e4),t:v,p:1,d:false});
 $('tin').value='';tSave();tRender();
}
$('tbtn').onclick=tAdd;
$('tin').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();tAdd()}});
$('tsort').onclick=function(){
 TS=TS.map(function(t,i){return {t:t,i:i}}).sort(function(a,b){return (a.t.d-b.t.d)||(a.t.p-b.t.p)||(a.i-b.i)}).map(function(o){return o.t});
 tSave();tRender();
};
$('tclr').onclick=function(){TS=TS.filter(function(t){return !t.d});if(tIdx(TSEL)<0)TSEL=null;tSave();tRender()};
tRender();

/* ===== Arrière-plan ===== */
var BG={w:null,a:null};
function bgStart(){
 try{ if('Notification' in window&&Notification.permission==='default')Notification.requestPermission() }catch(e){}
 try{
  if(!BG.a){
   var n=8000,b=new ArrayBuffer(44+n),v=new DataView(b),W=function(o,t){for(var i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i))};
   W(0,'RIFF');v.setUint32(4,36+n,true);W(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
   v.setUint32(24,8000,true);v.setUint32(28,8000,true);v.setUint16(32,1,true);v.setUint16(34,8,true);W(36,'data');v.setUint32(40,n,true);
   for(var i=0;i<n;i++)v.setUint8(44+i,128);
   BG.a=new Audio(URL.createObjectURL(new Blob([b],{type:'audio/wav'})));BG.a.loop=true;BG.a.volume=0.01;
  }
  BG.a.play().catch(function(){});
 }catch(e){}
}
try{
 var src='var t;onmessage=function(e){clearInterval(t);if(e.data==="go")t=setInterval(function(){postMessage(1)},1000)}';
 BG.w=new Worker(URL.createObjectURL(new Blob([src],{type:'application/javascript'})));
 BG.w.onmessage=function(){tick()};BG.w.postMessage('go');
}catch(e){}
document.addEventListener('click',function(e){if(e.target.closest&&e.target.closest('button'))bgStart()},true);

tick();setInterval(tick,1000);
var PT=[{n:'Pomodoro classique',w:25,b:5,l:20},{n:'Pomodoro court',w:15,b:3,l:10},{n:'Pomodoro long',w:50,b:10,l:30}],PS=null,pfg=$('pfg');
pfg.style.strokeDasharray=C;
function mmss(s){s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function pDur(){var t=PT[PS.t];return (PS.ph==='w'?t.w:PS.ph==='b'?t.b:t.l)*60}
function pStart(t){PS={t:t,ph:'w',n:0,paused:false,left:0};PS.end=Date.now()+pDur()*1000;pTick()}
var pxT=null,TITLE0=document.title;
function pxReset(){clearTimeout(pxT);pxT=null;$('px').classList.remove('sure');$('px').textContent='Arrêter'}
function pTick(){
 var now=Date.now(),d=new Date();
 $('pclock').textContent=d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
 $('pchoose').hidden=!!PS;$('prun').hidden=!PS;
 if(!PS){$('ptag').textContent='Pomodoro';$('pomo').dataset.k='w';document.title=TITLE0;return}
 var ch=false;
 while(!PS.paused&&PS.end<=now){
  if(PS.ph==='w'){PS.n++;PS.ph=PS.n%4===0?'L':'b'}else PS.ph='w';
  PS.end+=pDur()*1000;ch=true;
 }
 if(ch)beep();
 var t=PT[PS.t],dur=pDur(),left=PS.paused?PS.left:(PS.end-now)/1000,r=Math.min(1,Math.max(0,1-left/dur));
 $('pomo').dataset.k=PS.ph;
 $('ptag').textContent=t.n;
 $('pphase').textContent=PS.paused?'En pause':PS.ph==='w'?'Travail':PS.ph==='b'?'Pause':'Pause longue';
 $('ptime').textContent=mmss(left);
 pfg.style.strokeDashoffset=C*(1-r);
 $('psub').textContent=PS.ph==='w'?'Pomodoro '+(PS.n%4+1)+' sur 4':'Pomodoros terminés : '+PS.n;
 var nx=PS.ph==='w'?((PS.n+1)%4===0?'pause longue de <b>'+t.l+' min</b>':'pause de <b>'+t.b+' min</b>'):'travail de <b>'+t.w+' min</b>';
 $('pnext').innerHTML='Ensuite : '+nx;
 var f=PS.ph==='L'?4:PS.n%4,dots=$('pcyc').children;
 for(var k=0;k<4;k++){dots[k].className=(k<f?'f':'')+(PS.ph==='w'&&k===f?' c':'')}
 $('pp').textContent=PS.paused?'Reprendre':'Pause';$('pp').classList.toggle('paused',PS.paused);
 document.title=mmss(left)+' · '+$('pphase').textContent;
}
document.querySelectorAll('.pt').forEach(function(b){b.onclick=function(){pStart(Number(b.dataset.t))}});
$('pp').onclick=function(){
 if(!PS)return;
 if(PS.paused){PS.end=Date.now()+PS.left*1000;PS.paused=false}
 else{PS.left=(PS.end-Date.now())/1000;PS.paused=true}
 pTick();
};
$('px').onclick=function(){
 if(!pxT){this.classList.add('sure');this.textContent='Confirmer ?';pxT=setTimeout(pxReset,3000);return}
 pxReset();PS=null;pTick();
};
setInterval(pTick,250);pTick();
var PG=1;
function goPage(n){
 PG=n;
 document.body.classList.toggle('tsk',n===0);document.body.classList.toggle('pom',n===2);
 $('p3').inert=n!==0;$('p1').inert=n!==1;$('p2').inert=n!==2;
 ['d3','d1','d2'].forEach(function(id,k){$(id).classList.toggle('cur',k===n)});
}
$('d3').onclick=function(){goPage(0)};$('d1').onclick=function(){goPage(1)};$('d2').onclick=function(){goPage(2)};
var sx=null,sy=0;
document.addEventListener('touchstart',function(e){if(document.body.classList.contains('solo')||e.touches.length!==1){sx=null;return}sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',function(e){
 if(sx===null)return;
 var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;sx=null;
 if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){if(dx<0&&PG<2)goPage(PG+1);else if(dx>0&&PG>0)goPage(PG-1)}
},{passive:true});
document.addEventListener('keydown',function(e){
 if(document.body.classList.contains('solo'))return;
 if(e.target&&e.target.tagName==='INPUT')return;
 if(e.key==='ArrowLeft'&&PG>0)goPage(PG-1);else if(e.key==='ArrowRight'&&PG<2)goPage(PG+1);
});

</script>
